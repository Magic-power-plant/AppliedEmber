plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // This mod ships no mixins of its own (plan R2), but AE2 — a hard dependency — loads
            // its mixins in dev runs, and their refmaps are written in SRG names. Mixin has to remap
            // them against the development mappings; MixinGradle used to configure that for us.
            // Without these two properties any dev run (datagen, client, server) dies with
            // "could not find any targets matching 'Lnet/minecraft/...;m_XXXXXX_()V'".
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            // Makes AE2's resource pack visible to the generators, so the cross-mod model/texture
            // references in EmberItemModelProvider (drive cell LED, P2P part base model) validate.
            // MEGA Cells is visible for the same reason: the mega-tier cell models reference its
            // cell-side art, and the mega ember cells exist in this run because megacells is a
            // runtimeOnly dependency.
            args '--existing-mod', 'ae2'
            args '--existing-mod', 'megacells'
        }
    }
}

// Resources generated by the data generators (`gradlew runData`) live here and are part of the mod.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // The datagen cache is a build accelerator kept on disk for the next run, not a mod resource.
    exclude '.cache/**'
}

repositories {
    maven {
        name 'CurseMaven'
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name "Modmaven"
        url "https://modmaven.dev/"
        // For Gradle 5.1 and above, limit it to just AE2
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        // GuideME (an AE2 runtime dependency) is distributed through Modrinth.
        name "Modrinth"
        url "https://api.modrinth.com/maven"
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // AE2 and Embers Rekindled are both mandatory dependencies of this mod. They are needed on the
    // compile classpath, and on the runtime classpath as well so the development runs — in
    // particular the `data` run used to generate this mod's resources — can actually load.
    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    compileOnly fg.deobf("curse.maven:embers-rekindled-300777:${embers_version}")
    runtimeOnly fg.deobf("curse.maven:embers-rekindled-300777:${embers_version}")

    // MEGA Cells is an optional runtime dependency: the mega-tier ember cells
    // (EmberMegaCellContent) register only when it is loaded. It is deobf'd onto the compile
    // classpath (their StorageTier/components are referenced directly) and shipped to the dev runs.
    compileOnly fg.deobf("curse.maven:mega-cells-622112:${megacells_version}")
    runtimeOnly fg.deobf("curse.maven:mega-cells-622112:${megacells_version}")

    // MEGA Cells declares Cloth Config as a mandatory dependency; without it the dev runs refuse
    // to load megacells at all. It is never shipped with this mod.
    runtimeOnly fg.deobf("curse.maven:cloth-config-348521:${clothconfig_version}")

    // AE2 declares GuideME as a mandatory runtime dependency; without it the dev runs (datagen)
    // refuse to load AE2 at all. It is never shipped with this mod.
    runtimeOnly fg.deobf("maven.modrinth:guideme:${guideme_version}")

    // Lightweight unit tests for the pure logic (plan §8.2). Plain JUnit — no game bootstrap needed
    // for the algorithms under test, so `gradlew test` runs without starting Minecraft.
    // The tested classes are written against AE2's and Embers' APIs, and compileOnly dependencies are
    // not inherited by the test source set, so both are declared for tests explicitly.
    testImplementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    testImplementation fg.deobf("curse.maven:embers-rekindled-300777:${embers_version}")
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
